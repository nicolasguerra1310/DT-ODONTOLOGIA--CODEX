<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="blob">
      <rect x="5" y="5" width="190" height="190" rx="52" ry="52"/>
    </clipPath>
  </defs>
  <!-- Fondo blob gris claro -->
  <rect x="5" y="5" width="190" height="190" rx="52" ry="52" fill="#E5E5EA"/>
  <!-- D y T recortados al blob — posicionados para llenar el espacio como en el logo real -->
  <g clip-path="url(#blob)">
    <text x="64" y="160"
          text-anchor="middle"
          font-family="Georgia,'Times New Roman',serif"
          font-size="136" font-weight="700"
          fill="#0E307A">D</text>
    <text x="136" y="160"
          text-anchor="middle"
          font-family="Georgia,'Times New Roman',serif"
          font-size="136" font-weight="700"
          fill="#0E307A">T</text>
  </g>
  <!-- ODONTOLOGIA en el espacio negativo central -->
  <text x="100" y="108"
        text-anchor="middle"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="10.5" font-weight="400"
        fill="#0E307A" letter-spacing="4">ODONTOLOGIA</text>
</svg>
